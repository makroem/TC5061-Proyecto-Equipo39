name: e39-etapa6
services:
  api:
    image: mibici-equipo39:etapa6
    build:
      context: .
      dockerfile: deploy/Containerfile.api
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1g
    environment:
      MODEL_DIR: /app/model
      MODEL_MANIFEST: /app/model_manifest.json
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_DISABLE_AGENT_HINT: '1'
    ports:
      - '127.0.0.1:${API_PORT:-8006}:8000'
    volumes:
      - type: bind
        source: ${MODEL_PATH:-./models/serving/p1}
        target: /app/model
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MODEL_MANIFEST_PATH:-./references/etapa4/model_manifest.json}
        target: /app/model_manifest.json
        read_only: true
        bind: {create_host_path: false}
    tmpfs: [/tmp]
    networks: [backend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 12
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  mlflow:
    build:
      context: .
      dockerfile: deploy/Containerfile.mlflow
    image: mibici-equipo39:tracking-etapa6
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 1g
    environment:
      MLFLOW_DISABLE_AGENT_HINT: '1'
      DO_NOT_TRACK: '1'
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: 'false'
      HOME: /tmp
    command: [mlflow, server, --host, 0.0.0.0, --port, '5000', --workers, '1', --backend-store-uri, 'sqlite:////tracking/operations.db', --artifacts-destination, /tracking/artifacts, --serve-artifacts, --allowed-hosts, 'mlflow:5000,localhost:*,127.0.0.1:*']
    ports:
      - '127.0.0.1:${TRACKING_PORT:-5006}:5000'
    volumes: [tracking:/tracking]
    tmpfs: [/tmp]
    networks: [backend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 12
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  locust:
    image: locustio/locust:2.47.0
    profiles: [load]
    working_dir: /work
    environment: {PYTHONPATH: /work, PYTHONDONTWRITEBYTECODE: '1'}
    cpus: 0.5
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - ./tests/load:/work/tests/load:ro
      - ./mibici_equipo39:/work/mibici_equipo39:ro
      - ./private_results/etapa6:/results
    networks: [backend]
    command: [-f, tests/load/locustfile.py, --host, 'http://api:8000']
networks:
  backend: {driver: bridge}
volumes:
  tracking:
