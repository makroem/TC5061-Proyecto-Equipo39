name: Etapa 6 pruebas construccion y despliegue
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etapa6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  MLFLOW_DISABLE_AGENT_HINT: '1'
  DO_NOT_TRACK: '1'
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-api-dev.txt
      - run: python -m pip install -r requirements-api-dev.txt
      - run: python -m pip check
      - run: python -m pytest tests/api tests/operations -q --junitxml=private_results/etapa6/tests.xml
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: pruebas-${{ matrix.os }}
          path: private_results/etapa6/tests.xml
          retention-days: 14
  build-deploy:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MODEL_PATH: ./private_results/etapa6/ci/model
      MODEL_MANIFEST_PATH: ./private_results/etapa6/ci/model_manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: python -m pip install -r requirements-api.txt
      - name: Crear modelo de prueba aislado
        run: python -B -m scripts.create_ci_model
      - name: Validar Compose y construir servicios
        run: |
          docker compose config --quiet
          docker compose build
      - name: Desplegar y esperar salud
        run: docker compose up -d --wait --wait-timeout 300
      - name: Verificar prediccion desde el contenedor
        run: python -B -m mibici_equipo39.operations.smoke --manifest private_results/etapa6/ci/model_manifest.json --output private_results/etapa6/smoke_ci.json
      - name: Verificar tracking y persistencia
        run: |
          python -B -m mibici_equipo39.operations.tracking_check write
          docker compose up -d --force-recreate mlflow
          docker compose up -d --wait --wait-timeout 300
          python -B -m mibici_equipo39.operations.tracking_check read
      - name: Guardar diagnostico
        if: always()
        run: |
          docker compose ps > private_results/etapa6/compose_ci.txt
          docker compose logs --no-color > private_results/etapa6/compose_ci.log
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: despliegue-efimero
          path: |
            private_results/etapa6/smoke_ci.json
            private_results/etapa6/compose_ci.txt
            private_results/etapa6/compose_ci.log
          retention-days: 14
      - name: Detener entorno efimero
        if: always()
        run: docker compose down
