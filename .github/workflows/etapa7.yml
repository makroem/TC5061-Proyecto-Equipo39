name: Etapa 7 integridad de evidencias
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.9'
      - run: python -m unittest discover -s tests/final -v
      - run: python -B -m scripts.check_final_evidence
