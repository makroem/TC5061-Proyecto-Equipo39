name: Monitoreo y contraste estacional
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            requirements-monitoring.txt
            requirements-monitoring-dev.txt
      - run: python -m pip install -r requirements-monitoring-dev.txt
      - run: python -m pip check
      - run: python -m pytest tests/monitoring --confcutdir=tests/monitoring -q
